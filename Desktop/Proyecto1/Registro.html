<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | BioControl</title>

    <link rel="stylesheet" href="css/Registro.css">
</head>

<body>

    <div class="contenedor">

        <div class="caja">

            <h1 class="titulo">BioControl</h1>

            <h2 class="subtitulo">Registro de usuario</h2>

            <form action="Backend/Registro.Php" method="POST">

                <div class="grupo">
                    <label>Nombre</label>
                    <input type="text" name="nombre" placeholder="Ingrese su nombre" required>
                </div>

                <div class="grupo">
                    <label>Apellido</label>
                    <input type="text" name="apellido" placeholder="Ingrese su apellido" required>
                </div>

                <div class="grupo">
                    <label>Correo electrónico</label>
                    <input type="email" name="correo" placeholder="Ingrese su correo electrónico" required>
                </div>

                <div class="grupo">
                    <label>Contraseña</label>
                    <input type="password" name="password" placeholder="Ingrese su contraseña" required>
                </div>

                <div class="grupo">
                    <label>Confirmar contraseña</label>
                    <input type="password" name="confirm_password" placeholder="Confirme su contraseña" required>
                </div>

                <div class="boton">
                    <button type="submit">
                        Registrarse
                    </button>
                </div>

            </form>

            <p class="texto">
                ¿Ya tienes una cuenta?
                <a href="login.html">Iniciar sesión</a>
            </p>

            <p class="texto">
                <a href="index.html">← Volver al inicio</a>
            </p>

        </div>

    </div>

</body>

</html>
