		.leyenda strong { display: block; margin-bottom: 2px; }
		.leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
		#map-status { margin: 0 0 12px; color: #7a8580; font-size: 14px; }
	</style>
</head>
<body>

			<a class="employee-panel-link" href="../index.php#seleccionar-panel-empleado">Elegir panel</a>
			<button id="logout-btn">Cerrar sesión</button>
		</div>
	</header>

	<div class="layout">
		<aside class="sidebar">

            <nav>
				<a href="panel.html"><span>▣</span>Panel principal</a>
				<a href="Empleados.html"><span>♙</span>Empleados</a>
				<a href="rutas.html"><span>♧</span>Rutas</a>

				<a href="Incidencias.html"><span>!</span>Incidencias</a>
				<a href="Centros.html"><span>▦</span>Instalaciones</a>
				<a href="Maquinaria.html"><span>⚙</span>Maquinaria</a>

				<a href="MapaInteractivo.html" class="active"><span>♧</span>Mapa interactivo</a>
			</nav>

        </aside>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>Mapa interactivo</h1>
                    <p>Visualiza contenedores y rutas en el mapa.</p>
                </div>
            </div>

            <p id="map-status">Cargando contenedores...</p>
            <section class="data-table" style="padding: 0; overflow: hidden;">
                <div id="map"></div>
            </section>
        </main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/municipios-montevideo.js"></script>
    <script src="../js/geo-montevideo.js"></script>
    <script>
        const apiBase = 'http://localhost/DESIPROYECTO/Backend/apis/gestion/ApiGestion.php?recurso=';
        const limitesMontevideo = L.latLngBounds([-34.95, -56.43], [-34.70, -56.01]);
        const colores = { activo: '#238b57', inactivo: '#d64545', reserva: '#e0a030' };
        const contenedoresDemo = [
            [-34.855, -56.190], [-34.858, -56.174], [-34.861, -56.157], [-34.864, -56.204],
            [-34.867, -56.184], [-34.870, -56.166], [-34.873, -56.148], [-34.876, -56.211],
            [-34.879, -56.193], [-34.882, -56.175], [-34.885, -56.157], [-34.888, -56.139],
            [-34.891, -56.204], [-34.894, -56.186], [-34.897, -56.168], [-34.900, -56.150],
            [-34.903, -56.132], [-34.906, -56.197], [-34.909, -56.179], [-34.912, -56.161],
            [-34.915, -56.143], [-34.918, -56.188], [-34.921, -56.170], [-34.924, -56.152]
        ];
        const mapa = L.map('map', { maxBounds: limitesMontevideo.pad(0.1), minZoom: 11 }).setView([-34.88, -56.17], 12);
        const capa = L.layerGroup().addTo(mapa);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(mapa);

        const leyenda = L.control({ position: 'bottomright' });
        leyenda.onAdd = () => {
            const div = L.DomUtil.create('div', 'leyenda');
            div.innerHTML = '<strong>Estado del contenedor</strong>' +
                Object.entries(colores).map(([estado, color]) =>
                    `<div><i style="background:${color}"></i>${estado.charAt(0).toUpperCase() + estado.slice(1)}</div>`).join('') +
                '<div><i style="background:#607d8b"></i>Contenedor de demostración</div>' +
                '<div><i style="background:#fff;border:3px solid #c62828;box-sizing:border-box"></i>Con incidencias abiertas</div>';
            return div;
        };
        leyenda.addTo(mapa);

        function escapar(valor) {
            return String(valor ?? '').replace(/[&<>'"]/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[c]));
        }

        async function obtenerJson(recurso) {
            const respuesta = await fetch(apiBase + recurso, { credentials: 'same-origin' });
            const datos = await respuesta.json();
            if (!respuesta.ok || datos.status === 'error') throw new Error(datos.message || 'Error al cargar datos');
            return datos.data || [];
        }

        const separadorCalles = ' esq. ';

        function ubicarContenedor(c) {
            const [calle1, calle2] = String(c.Ubicacion || '').split(separadorCalles).map(calle => calle.trim());
            return GeoMontevideo.ubicarCalles(calle1, calle2);
        }

        async function cargarMapa() {
            const estado = document.getElementById('map-status');
            try {
                const [contenedores, municipios, incidencias] = await Promise.all([obtenerJson('contenedores'), obtenerJson('municipios'), obtenerJson('incidencias')]);
                const incidenciasPorContenedor = {};
                incidencias.forEach(i => {
                    if (i.Numero_Contenedor) (incidenciasPorContenedor[i.Numero_Contenedor] ||= []).push(i);
                });
                const nombres = {};
                municipios.forEach(m => { nombres[String(m.id_municipio)] = m.nombre; });

                const puntos = [];
                let sinUbicar = 0;
                for (let i = 0; i < contenedores.length; i++) {
                    const c = contenedores[i];
                    estado.textContent = `Ubicando contenedores en el mapa (${i + 1}/${contenedores.length})...`;
                    const municipio = nombres[String(c.Id_Municipio)] || '';
                    const coordenadas = await ubicarContenedor(c);
                    if (!coordenadas) { sinUbicar++; continue; }
                    const color = colores[String(c.Estado).toLowerCase()] || '#4a6fa5';
                    const susIncidencias = incidenciasPorContenedor[c.Numero_Contenedor] || [];
                    const abiertas = susIncidencias.filter(i => i.Estado !== 'resuelta').length;
                    const listaIncidencias = susIncidencias.length
                        ? '<hr><strong>Incidencias (' + susIncidencias.length + ')</strong><ul style="margin:4px 0 0 16px;padding:0;">' +
                          susIncidencias.map(i => '<li>' + escapar(i.Tipo) + ' - ' + escapar(i.Estado) + '<br><small>' + escapar(i.Descripcion) + '</small></li>').join('') + '</ul>'
                        : '<hr><em>Sin incidencias</em>';
                    L.circleMarker(coordenadas, { radius: 10, color: abiertas ? '#c62828' : '#fff', weight: abiertas ? 4 : 2, fillColor: color, fillOpacity: 0.9 })
                        .bindPopup(`<strong>Contenedor N° ${escapar(c.Numero_Contenedor)}</strong><br>
                            Tipo: ${escapar(c.Tipo_Residuo)}<br>
                            Estado: ${escapar(c.Estado)}<br>
                            Capacidad: ${escapar(c.Capacidad)}<br>
                            Ubicación: ${escapar(c.Ubicacion)}<br>
                            Municipio: ${escapar(municipio)}${listaIncidencias}`)
                        .addTo(capa);
                    puntos.push(coordenadas);
                }
                contenedoresDemo.forEach((coordenadas, indice) => {
                    L.circleMarker(coordenadas, {
                        radius: 8,
                        color: '#fff',
                        weight: 2,
                        fillColor: '#607d8b',
                        fillOpacity: 0.95
                    })
                        .bindPopup(`<strong>Contenedor de demostración ${indice + 1}</strong><br>No está guardado en la base de datos.`)
                        .addTo(capa);
                    puntos.push(coordenadas);
                });
                if (puntos.length) mapa.fitBounds(puntos, { padding: [40, 40], maxZoom: 16 });
                estado.textContent = `${contenedores.length} contenedores registrados y ${contenedoresDemo.length} de demostración (no guardados)` +
                    (sinUbicar ? `; ${sinUbicar} registrados sin ubicación encontrada.` : '.');
            } catch (error) {
                estado.textContent = error.message || 'No se pudo cargar el mapa.';
            }
        }

        cargarMapa();
    </script>
    <script src="../js/admin-auth.js?v=18" defer></script>
</body>
</html>
