<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | SIGERU</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="contenedor">
        <div class="caja">
            <img src="css/img/logosigeru.png" alt="Logo SIGERU" class="logo">
            <h1 id="titulo-form">Iniciar Sesión</h1>

            <form id="loginForm">
                <div class="grupo">
                    <label>Cédula o email</label>
                    <input type="text" id="identificador" name="identificador" required maxlength="100">
                </div>

                <div class="grupo">
                    <label>Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" id="btn-accion">Ingresar</button>
            </form>

            <div id="mensaje"></div>

            <p>
                <a href="index.php">Volver al inicio</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const identificador = document.getElementById('identificador').value.trim();
            const password = document.getElementById('password').value;
            const mensajeDiv = document.getElementById('mensaje');

            mensajeDiv.style.color = '#555';
            mensajeDiv.textContent = 'Verificando credenciales...';

            const formData = new FormData();
            formData.append('identificador', identificador);
            formData.append('password', password);

            fetch('../Backend/Login.php', {
                method: 'POST',
                body: formData,
                credentials: 'same-origin',
                cache: 'no-store'
            })
            .then(async res => {
                const text = await res.text();
                try {
                    return JSON.parse(text);
                } catch (error) {
                    throw new Error('Respuesta no válida del servidor: ' + text);
                }
            })
            .then(data => {
                if (data.status === 'success') {
                    sessionStorage.removeItem('sigeru_sesion');
                    mensajeDiv.style.color = 'green';
                    mensajeDiv.textContent = data.must_change_password
                        ? 'Primer ingreso: tenés que cambiar tu contraseña para continuar.'
                        : data.message;

                    setTimeout(() => {
                        window.location.replace(data.must_change_password
                            ? 'Configuracion.html?cambio-obligatorio=1'
                            : 'index.php?login=1');
                    }, 1000);
                } else {
                    mensajeDiv.style.color = 'red';
                    mensajeDiv.textContent = data.message;
                }
            })
            .catch(err => {
                console.error(err);
                mensajeDiv.style.color = 'red';
                mensajeDiv.textContent = 'Error de conexión con el servidor.';
            });
        });
    </script>
</body>
</html>
